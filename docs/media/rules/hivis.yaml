source:
  camera: 0
rules:
- name: no-hivis
  when: A person in the loading bay is wearing ordinary clothes with no high-visibility vest.
  false_means: Everyone visible wears a fluorescent hi-vis vest, or the loading bay is empty.
  threshold: 0.8
  then:
  - log
- name: hivis-worn
  when: A person in the loading bay is wearing a fluorescent high-visibility vest.
  threshold: 0.8
  then:
  - log
