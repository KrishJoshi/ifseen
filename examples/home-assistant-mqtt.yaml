# Publish rules as Home Assistant entities over MQTT (pip install 'ifseen[mqtt]').
# Gives binary_sensor.garage_garage_open, sensor.garage_garage_open_probability,
# camera.garage_last_trigger, switch.garage_watching... See docs/homeassistant.md.
source:
  url:
    url: http://homeassistant.local:8123/api/camera_proxy/camera.garage
    headers:
      Authorization: Bearer ${HA_TOKEN}
every: 30s
mqtt:
  host: homeassistant.local
  username: ${MQTT_USERNAME:-ifseen}
  password: ${MQTT_PASSWORD}
  name: Garage
rules:
  - name: garage-open
    when: The garage door is open.
    false_means: The garage door is fully closed.
    threshold: 0.85
    for: 2
    cooldown: 0
    ha_device_class: garage_door
