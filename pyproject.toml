[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ifseen"
version = "0.1.0"
description = "If seen (or heard), then do. Plain-English triggers for your screen, camera and mic, powered by decision models."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Krish Joshi" }]
keywords = [
    "decision-model", "gemini-decision", "jev", "system-one", "automation",
    "computer-vision", "home-automation", "screen-monitoring", "ifttt", "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.27",
    "pillow>=10.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
screen = ["mss>=9.0"]
camera = ["opencv-python-headless>=4.9"]
mic = ["sounddevice>=0.4.6", "numpy>=1.26"]
# Free offline `local` provider. Large (torch); deliberately not part of `all`.
local = ["torch>=2.2", "transformers>=4.41", "sentencepiece>=0.2", "protobuf>=4.25"]
all = ["mss>=9.0", "opencv-python-headless>=4.9", "sounddevice>=0.4.6", "numpy>=1.26"]
dev = ["pytest>=8.0", "ruff>=0.6", "mss>=9.0", "opencv-python-headless>=4.9", "numpy>=1.26"]

[project.scripts]
ifseen = "ifseen.cli:main"

[project.urls]
Homepage = "https://github.com/KrishJoshi/ifseen"
Issues = "https://github.com/KrishJoshi/ifseen/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ifseen"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
