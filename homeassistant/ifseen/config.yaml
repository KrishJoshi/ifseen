name: ifseen
version: "0.1.0"
slug: ifseen
description: Plain-English triggers for your cameras, as Home Assistant entities over MQTT.
url: https://github.com/KrishJoshi/ifseen
# Prebuilt per-arch images from .github/workflows/release.yml, so the Supervisor pulls instead of
# building on the device. The tag is this file's `version`, so bump both together.
image: "ghcr.io/krishjoshi/{arch}-addon-ifseen"
# opencv-python-headless only ships glibc wheels for these (no armv7/i386, no musl).
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
# SUPERVISOR_TOKEN can read HA cameras via http://supervisor/core/api/camera_proxy/<entity>
homeassistant_api: true
services:
  - mqtt:want
map:
  - addon_config:rw
  - homeassistant_config:ro
  - share:rw
  - media:rw
options:
  provider: auto
  rules_path: /config
  dry_run: false
schema:
  provider: list(auto|gemini|jev|azure|systemone|openai|ollama|mock)
  gemini_api_key: password?
  typesafe_api_key: password?
  openai_api_key: password?
  openai_base_url: url?
  azure_decision_endpoint: url?
  azure_decision_key: password?
  azure_decision_deployment: str?
  rules_path: str
  rules: str?
  name: str?
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  dry_run: bool
