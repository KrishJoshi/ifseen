# PPE check on an existing CCTV camera: someone in the loading bay without a hi-vis vest.
# No labelled dataset, no custom detector, no retraining per site - edit the sentence instead.
source:
  camera: ${DOCK_CAMERA:-rtsp://user:pass@dock-cam/stream}
every: 2s
context: Fixed CCTV camera over a warehouse loading bay.
rules:
  - name: no-hivis
    when: A person in the loading bay is wearing ordinary clothes with no high-visibility vest.
    false_means: Everyone visible wears a fluorescent hi-vis vest, or the loading bay is empty.
    threshold: 0.8
    for: 2
    cooldown: 5m
    ha_device_class: safety
    then:
      - snapshot: ~/ifseen-captures/dock
      - webhook: {url: "${SAFETY_WEBHOOK_URL:-http://localhost:8080/ppe-alert}", image: true}
  - name: person-near-forklift
    when: A person on foot is standing within a couple of metres of a moving forklift.
    threshold: 0.8
    for: 2
    cooldown: 2m
    ha_device_class: safety
    then:
      - snapshot: ~/ifseen-captures/dock
      - webhook: {url: "${SAFETY_WEBHOOK_URL:-http://localhost:8080/ppe-alert}", image: true}
